version: 2

project_name: doc-connector

builds:
  - id: doc-connector
    main: ./cmd/doc-connector
    binary: doc-connector
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: doc-connector
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: doc-connector
    repository:
      owner: LZD121
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/LZD121/doc-connector
    description: Sync a private docs directory to your own private git repository
    binaries:
      - doc-connector
    # Publish only when the tap token is configured; otherwise the cask is
    # still generated into dist/ and the release stays green.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}' 

snapshot:
  version_template: "{{ incpatch .Version }}-next"

scoops:
  - name: doc-connector
    repository:
      owner: LZD121
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/LZD121/doc-connector
    description: Sync a private docs directory to your own private git repository
    # Same rule as the cask: without a bucket token the manifest is generated
    # into dist/ and the release stays green.
    skip_upload: '{{ if index .Env "SCOOP_BUCKET_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
