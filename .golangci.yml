version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # User-facing writers and deferred cleanup are intentionally best-effort;
      # errors that change correctness are still checked at their call sites.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/LZD121/doc-connector/internal/state.Lock).Release
        - (*github.com/LZD121/doc-connector/internal/fsx.Root).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
